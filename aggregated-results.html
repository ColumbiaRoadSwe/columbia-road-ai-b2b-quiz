<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Maturity · Live Results</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#002A3A; --forest:#034638; --burgundy:#651D32;
  --yellow:#FDD17A; --cream:#F9F6EC; --light-blue:#B9D9EB;
  --taupe:#988873; --warm:#E5E1DC; --grey-d:#E5E5E5; --grey-c:#C0C0C0;
  --black:#161616; --grey-b:#353535; --white:#FFFFFF;
  --display:'Playfair Display',Georgia,serif;
  --body:'Work Sans',sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box }
body { background:var(--navy); color:var(--white); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh }

/* ── Header ── */
.hdr { display:flex; justify-content:space-between; align-items:center; padding:20px 32px; border-bottom:1px solid rgba(255,255,255,.12) }
.hdr-left { display:flex; align-items:baseline; gap:16px }
.hdr-title { font-family:var(--display); font-size:1.5rem; font-weight:400; color:var(--white) }
.hdr-tag { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.08em; color:var(--yellow) }
.hdr-right { text-align:right }
.participant-count { font-family:var(--display); font-size:2.25rem; font-weight:400; color:var(--yellow); line-height:1 }
.participant-label { font-size:12px; color:rgba(255,255,255,.55); margin-top:2px }
.refresh-status { font-size:11px; color:rgba(255,255,255,.4); margin-top:6px; display:flex; align-items:center; justify-content:flex-end; gap:6px }
.pulse { width:7px; height:7px; border-radius:50%; background:var(--yellow); opacity:0; transition:opacity .3s }
.pulse.active { opacity:1 }

/* ── Layout ── */
.grid { display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:2px }
.card { background:rgba(255,255,255,.04); padding:28px 28px 24px }
.card-wide { grid-column:1 / -1 }
.card-label { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.08em; color:var(--yellow); margin-bottom:4px }
.card-title { font-family:var(--display); font-size:1.25rem; font-weight:400; margin-bottom:20px }

/* ── Empty state ── */
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:calc(100vh - 90px); gap:12px; opacity:.45 }
.empty-icon { font-size:3rem; opacity:.5 }
.empty-text { font-family:var(--display); font-size:1.5rem }
.empty-sub { font-size:13px }

/* ── Donut chart ── */
.donut-wrap { display:flex; gap:32px; align-items:center }
.donut-svg { flex-shrink:0 }
.donut-legend { display:flex; flex-direction:column; gap:12px; flex:1 }
.legend-item { display:flex; align-items:center; gap:10px; font-size:13px; line-height:1.35 }
.legend-dot { width:12px; height:12px; min-width:12px; border-radius:50% }
.legend-label { color:rgba(255,255,255,.8) }
.legend-pct { margin-left:auto; font-weight:600; color:var(--white); font-size:14px }

/* ── Bar chart (readiness bands) — bar colour set inline, by position ── */
.hist-bars { display:flex; align-items:flex-end; gap:6px; height:120px }
.hist-bar-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1 }
.hist-bar { width:100%; background:var(--forest); border-radius:4px 4px 0 0; transition:height .6s cubic-bezier(.4,0,.2,1); min-height:2px; position:relative }
.hist-bar-count { font-size:10px; color:rgba(255,255,255,.55); line-height:1 }
.hist-labels { display:flex; gap:6px; margin-top:6px }
.hist-label { flex:1; text-align:center; font-size:10px; color:rgba(255,255,255,.4) }

/* ── Horizontal bar chart (blockers) ── */
.bar-list { display:flex; flex-direction:column; gap:14px }
.bar-item { display:flex; flex-direction:column; gap:5px }
.bar-header { display:flex; justify-content:space-between; align-items:baseline }
.bar-label-text { font-size:13px; color:rgba(255,255,255,.85) }
.bar-pct-text { font-size:13px; font-weight:600; color:var(--yellow) }
.bar-track { height:8px; background:rgba(255,255,255,.1); border-radius:4px; overflow:hidden }
.bar-fill { height:100%; background:var(--burgundy); border-radius:4px; transition:width .8s cubic-bezier(.4,0,.2,1) }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-left">
    <div>
      <div class="hdr-tag">Columbia Road · Stockholm 2026</div>
      <div class="hdr-title">AI Maturity in B2B Sales &amp; Marketing</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="participant-count" id="count">—</div>
    <div class="participant-label">participants so far</div>
    <div class="refresh-status">
      <span class="pulse" id="pulse"></span>
      <span id="updated">Connecting…</span>
    </div>
  </div>
</header>

<div id="root"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
// Paste the deployed Apps Script URL here after redeploying with the doGet handler
const DASHBOARD_DATA_URL = 'https://script.google.com/macros/s/AKfycby-Zy07mCjO1Cztm9qpGx61ToDO1JokwzLPhJ3VcN3yS0IZ_wzt0MDoKNzwD_czHlXH/exec';
const REFRESH_INTERVAL_MS = 45000;

// ── Palettes ──────────────────────────────────────────────────────────────────
// Deliberately no stage or band label strings in this file. The Apps Script
// returns its distributions zero-filled in canonical order, and colours are
// assigned by POSITION — hardcoding labels here is what silently broke the
// stage donut when the quiz's scoring was rewritten.
const STAGE_PALETTE = ['#E5E1DC', '#F7CED7', '#B9D9EB', '#034638']; // S0 → S3
const BAND_PALETTE  = ['#651D32', '#988873', '#FDD17A', '#B9D9EB', '#034638'];
const DIM_PALETTE   = ['#002A3A', '#034638', '#651D32', '#988873']; // matches index.html DIMS
const STALE_AFTER_MS = 3 * 60 * 1000;

// ── SVG helpers ───────────────────────────────────────────────────────────────
function polarToXY(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function arcPath(cx, cy, r, startDeg, endDeg) {
  const s = polarToXY(cx, cy, r, startDeg);
  const e = polarToXY(cx, cy, r, endDeg);
  const large = (endDeg - startDeg) > 180 ? 1 : 0;
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y}`;
}

// ── Donut chart ───────────────────────────────────────────────────────────────
// Server key order is canonical; colour by index. Zero-count stages are skipped
// in the arc loop but KEPT in the legend at 0% — "nobody here is at Stage 3 yet"
// is a better talking point than a missing row.
function renderDonut(stageDist, total) {
  const cx = 80, cy = 80, r = 64;
  const names = Object.keys(stageDist || {});
  if (!names.length) return '<div style="color:rgba(255,255,255,.35);font-size:13px">No data yet</div>';

  let segments = '';
  let legendItems = '';
  let current = 0;

  names.forEach((name, i) => {
    const count = stageDist[name] || 0;
    const pct = total > 0 ? count / total : 0;
    const color = STAGE_PALETTE[i % STAGE_PALETTE.length];

    if (pct > 0) {
      if (pct >= 1) {
        // Full circle — two arcs, since a 360° arc is degenerate in SVG
        segments += `<path d="${arcPath(cx,cy,r,0,180)}" fill="none" stroke="${color}" stroke-width="24"/>`;
        segments += `<path d="${arcPath(cx,cy,r,180,360)}" fill="none" stroke="${color}" stroke-width="24"/>`;
      } else {
        segments += `<path d="${arcPath(cx,cy,r,current,current + pct*360)}" fill="none" stroke="${color}" stroke-width="24"/>`;
      }
      current += pct * 360;
    }

    // 'Stage 2: First agents live' → 'S2 · First agents live'
    const shortName = name.replace(/^Stage (\d+):\s*/, 'S$1 · ');
    legendItems += `
      <div class="legend-item"${count === 0 ? ' style="opacity:.45"' : ''}>
        <div class="legend-dot" style="background:${color}"></div>
        <div class="legend-label">${shortName}</div>
        <div class="legend-pct">${Math.round(pct * 100)}%</div>
      </div>`;
  });

  return `
    <div class="donut-wrap">
      <svg class="donut-svg" width="160" height="160" viewBox="0 0 160 160">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="24"/>
        ${segments}
      </svg>
      <div class="donut-legend">${legendItems}</div>
    </div>`;
}

// ── Readiness bands ───────────────────────────────────────────────────────────
// Replaces the old 0–100 decile histogram. Real scores compress into roughly
// 20–55 (the NA_CREDIT floor in index.html gives every unanswered question 0.25),
// so deciles were the wrong axis — the five READY bands are the real cut points.
const BAND_SHORT = ['Not there', 'Early', 'Getting there', 'Ready', 'Solid'];

function renderBands(bandDist, readiness) {
  const names = Object.keys(bandDist || {});
  if (!names.length) return '<div style="color:rgba(255,255,255,.35);font-size:13px">No data yet</div>';

  const counts = names.map(n => bandDist[n] || 0);
  const maxCount = Math.max(...counts, 1);

  const bars = counts.map((c, i) => `
      <div class="hist-bar-wrap">
        <div class="hist-bar-count">${c > 0 ? c : ''}</div>
        <div class="hist-bar" style="height:${Math.max((c / maxCount) * 100, c > 0 ? 4 : 2)}%;background:${BAND_PALETTE[i % BAND_PALETTE.length]}"></div>
      </div>`).join('');

  const labels = names.map((n, i) =>
    `<div class="hist-label">${BAND_SHORT[i] || n}</div>`
  ).join('');

  const median = readiness && readiness.median !== null && readiness.median !== undefined
    ? `median score ${readiness.median}/100` : 'no scores yet';

  return `
    <div class="hist-bars">${bars}</div>
    <div class="hist-labels">${labels}</div>
    <div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:8px;text-align:center">Readiness band · ${median}</div>`;
}

// ── The four foundations ──────────────────────────────────────────────────────
// Room average per dimension. Reuses the blocker bar-list CSS. Fixed server
// order so bars don't reshuffle between 45s polls in front of an audience.
function renderDims(dimMeans) {
  const names = Object.keys(dimMeans || {});
  if (!names.length) return '<div style="color:rgba(255,255,255,.35);font-size:13px">No data yet</div>';

  return `<div class="bar-list">` + names.map((name, i) => {
    const pct = Math.max(0, Math.min(100, Math.round(dimMeans[name] || 0)));
    return `
      <div class="bar-item">
        <div class="bar-header">
          <div class="bar-label-text">${name}</div>
          <div class="bar-pct-text">${pct}%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%;background:${DIM_PALETTE[i % DIM_PALETTE.length]}"></div>
        </div>
      </div>`;
  }).join('') + `</div>`;
}

// ── Blocker bar chart ─────────────────────────────────────────────────────────
function renderBlockers(blockerCounts, total) {
  if (!total || Object.keys(blockerCounts).length === 0) {
    return '<div style="color:rgba(255,255,255,.35);font-size:13px">No data yet</div>';
  }

  const sorted = Object.entries(blockerCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);

  const maxCount = sorted[0][1];

  return `<div class="bar-list">` + sorted.map(([label, count]) => {
    const pct = total > 0 ? Math.round((count / total) * 100) : 0;
    const barWidth = maxCount > 0 ? Math.round((count / maxCount) * 100) : 0;
    return `
      <div class="bar-item">
        <div class="bar-header">
          <div class="bar-label-text">${label}</div>
          <div class="bar-pct-text">${pct}%</div>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${barWidth}%"></div>
        </div>
      </div>`;
  }).join('') + `</div>`;
}

// ── Main render ───────────────────────────────────────────────────────────────
function render(data) {
  const root = document.getElementById('root');
  const count = document.getElementById('count');

  if (!data || data.total === 0) {
    count.textContent = '0';
    root.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⏳</div>
        <div class="empty-text">Waiting for first submission…</div>
        <div class="empty-sub">Results will appear here as people complete the quiz</div>
      </div>`;
    return;
  }

  count.textContent = data.total;

  root.innerHTML = `
    <div class="grid">
      <div class="card">
        <div class="card-label">What's actually live</div>
        <div class="card-title">Where the room is</div>
        ${renderDonut(data.stage_distribution, data.total)}
      </div>

      <div class="card">
        <div class="card-label">Readiness</div>
        <div class="card-title">How ready the room is</div>
        ${renderBands(data.band_distribution, data.readiness)}
      </div>

      <div class="card">
        <div class="card-label">Room average</div>
        <div class="card-title">The four foundations</div>
        ${renderDims(data.dimension_means)}
      </div>

      <div class="card">
        <div class="card-label">What's getting in the way</div>
        <div class="card-title">Top blockers</div>
        ${renderBlockers(data.top_blockers, data.total)}
      </div>

      <div class="card card-wide">
        <div class="card-label">Where people want to start</div>
        <div class="card-title">Top opportunities</div>
        ${renderBlockers(data.top_opportunities, data.total)}
      </div>
    </div>`;
}

// ── Fetch and refresh ─────────────────────────────────────────────────────────
function fmt(d) {
  return d.getHours().toString().padStart(2,'0') + ':' +
         d.getMinutes().toString().padStart(2,'0') + ':' +
         d.getSeconds().toString().padStart(2,'0');
}

function fetchData() {
  const pulse = document.getElementById('pulse');
  const updated = document.getElementById('updated');
  pulse.classList.add('active');

  fetch(DASHBOARD_DATA_URL)
    .then(r => r.json())
    .then(data => {
      if (data && data.error) throw new Error(data.error);
      render(data);
      updated.textContent = 'Updated ' + fmt(new Date());
      // Tint if the server's own data is stale — catches a dead poll on a screen
      // nobody is watching closely.
      const age = data && data.generated_at
        ? Date.now() - new Date(data.generated_at).getTime() : 0;
      updated.style.color = age > STALE_AFTER_MS ? 'var(--yellow)' : '';
    })
    .catch(err => {
      updated.textContent = 'Error — retrying';
      updated.style.color = 'var(--yellow)';
      console.error(err);
    })
    .finally(() => {
      setTimeout(() => pulse.classList.remove('active'), 600);
    });
}

fetchData();
setInterval(fetchData, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
